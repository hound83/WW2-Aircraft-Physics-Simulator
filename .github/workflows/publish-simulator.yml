name: Publish simulator
on:
  pull_request:
    paths: [.github/workflows/publish-simulator.yml]
  push:
    branches: [main]
    paths: [.github/workflows/publish-simulator.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      html_sha256: ${{ steps.stage.outputs.html_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node validation/diagnostics/joint_calibration_v28.cjs
      - run: npm run check
      - run: node scripts/verify-pre-pr1.cjs
      - run: npm run test:browser
      - name: Stage the tested simulator
        id: stage
        run: |
          mkdir -p "$RUNNER_TEMP/simulator-pages"
          cp dist/model.html "$RUNNER_TEMP/simulator-pages/index.html"
          sha=$(sha256sum "$RUNNER_TEMP/simulator-pages/index.html")
          printf 'html_sha256=%s\n' "${sha%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/simulator-pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify the live simulator
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HTML_SHA256: ${{ needs.build.outputs.html_sha256 }}
        run: |
          live_html="$RUNNER_TEMP/published-simulator.html"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 12 --compressed \
              "${PAGE_URL}?build=${GITHUB_SHA}" --output "$live_html" && \
              printf '%s  %s\n' "$HTML_SHA256" "$live_html" | sha256sum --check --status; then
              printf 'Verified the tested simulator at %s\n' "$PAGE_URL"
              exit 0
            fi
            sleep 5
          done
          echo 'The public simulator did not match the tested build.' >&2
          exit 1

