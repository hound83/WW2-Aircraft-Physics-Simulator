name: Physics regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-validation
          path: |
            validation/current/
            dist/model.html
            dist/build.json
            releases/*.md
            docs/CURRENT_VALIDATION.md
