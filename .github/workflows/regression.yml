name: Physics regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node validation/diagnostics/joint_calibration_v28.cjs
      - run: npm run check
      - run: node scripts/verify-pre-pr1.cjs
      - run: npm run test:browser
      - name: Record generated validation
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const p of ['docs/V28_RESULTS.md','docs/V29_ROBUSTNESS.md','docs/CURRENT_VALIDATION.md','validation/current/v28-working.json','validation/current/test-summary.json','validation/current/baseline-diff.json','validation/current/build.json','docs/V3_RELEASE_CANDIDATE.md','validation/current/v3-coverage.json','validation/current/browser-smoke.json','docs/V31_CLIMB_IMPROVEMENT.md','validation/current/v31-climb-improvement.json']){
            console.log('V28_FILE '+JSON.stringify({path:p,content:fs.readFileSync(p,'utf8')}));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-validation
          path: |
            validation/current/
            dist/model.html
            dist/build.json
            dist/research-catalog.json
            releases/*.md
            docs/V4_MILESTONE.md
            docs/CURRENT_VALIDATION.md
            docs/V28_RESULTS.md
            docs/V29_ROBUSTNESS.md
            docs/V3_RELEASE_CANDIDATE.md
            docs/V31_CLIMB_IMPROVEMENT.md
            docs/V32_HIGH_ALTITUDE_VALIDATION.md
            docs/OVERALL_PROGRESS_PRE_PR1_TO_NOW.md
            docs/V33_MEASURED_POWER_CLIMB.md
            docs/V34_CONFIGURATION_MODEL.md
            calibration/v3.4*.json
